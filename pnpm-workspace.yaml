allowBuilds:
  '@swc/core': true
  # Base Mongo de test (dev/) : binaire téléchargé au premier lancement seulement.
  mongodb-memory-server: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# pnpm 11 refuse les versions de moins de 24 h : le modèle Payload réclamait
# @typescript-eslint 8.72.0, trop récente. Outillage de lint seulement ; à
# retirer quand 8.72+ sera acceptée.
overrides:
  '@typescript-eslint/typescript-estree': 8.70.0
  '@typescript-eslint/utils': 8.70.0
  '@typescript-eslint/types': 8.70.0
  '@typescript-eslint/scope-manager': 8.70.0
  '@typescript-eslint/visitor-keys': 8.70.0
